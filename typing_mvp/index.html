<!DOCTYPE html>
<html lang="en">
  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Typing Test MVP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Typing Test</h1>
<div class="stats">
<span>Time: <b id="time">60</b>s</span>
<span>WPM: <b id="wpm">0</b></span>
<span>Accuracy: <b id="accuracy">100</b>%</span>
</div>
<div id="text" class="text"></div>
<input id="input" type="text" autocomplete="off" placeholder="Start typing...">
<div class="buttons">
<button id="restart">Restart</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
