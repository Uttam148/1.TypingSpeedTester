<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Typing Speed Tester</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Typing Test</h1>

        <!-- Statistics -->
        <div class="stats">

            <div>
                <strong>Time</strong>
                <span id="time">60</span>s
            </div>

            <div>
                <strong>WPM</strong>
                <span id="wpm">0</span>
            </div>

            <div>
                <strong>Accuracy</strong>
                <span id="accuracy">100</span>%
            </div>

        </div>


        <!-- Test duration -->
        <div class="duration">

            <button onclick="setDuration(15)">
                15s
            </button>

            <button onclick="setDuration(30)">
                30s
            </button>

            <button onclick="setDuration(60)">
                60s
            </button>

            <button onclick="setDuration(120)">
                120s
            </button>

        </div>


        <!-- Typing passage -->
        <div
            class="text"
            id="text"
            tabindex="0"
        ></div>


        <!-- Hidden input used to capture keyboard typing -->
        <input
            id="input"
            class="hidden-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
        >


        <!-- Restart button -->
        <button id="restart">
            Restart
        </button>


        <!-- Performance graph -->
        <canvas id="performanceChart"></canvas>

    </div>


    <script src="script.js"></script>

</body>

</html>
